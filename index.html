<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#007bff" />
    <!-- Favicon and touch icons (served from public/favicon) -->
    <link rel="icon" href="./favicon/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="./favicon/favicon-96x96.png"
    />
    <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="./favicon/web-app-manifest-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="./favicon/web-app-manifest-512x512.png"
    />
    <link rel="apple-touch-icon" href="./favicon/apple-touch-icon.png" />
    <title>Blood Pressure Tracker</title>
    <link rel="manifest" href="./manifest.json" />
    <script type="module" crossorigin src="/blood-pressure-tracker/assets/index-BaLK9kHp.js"></script>
    <link rel="stylesheet" crossorigin href="/blood-pressure-tracker/assets/index-CGHCqghP.css">
  </head>
  <body>
    <div class="content-wrapper">
      <div class="top-bar">
        <div id="user-management" class="user-management">
          <select title="Select user" id="select-user" aria-label="Select user">
            <option value="">No User</option>
          </select>
          <button title="Add new user" id="add-user-btn">+</button>
        </div>

        <div class="top-bar-buttons-container">
          <button
            id="theme-toggle-btn"
            class="theme-toggle-btn"
            aria-label="Toggle theme"
            title="Toggle light/dark theme"
          >
            <span class="theme-icon">🌙</span>
          </button>

          <button
            id="install-btn"
            aria-label="Download / Install app"
            title="Install App"
            class="install-btn"
            style="display: none"
          >
            <span aria-hidden="true">&#8681;</span>
          </button>

          <button
            id="settings-btn"
            class="settings-btn"
            aria-label="Open Settings"
            title="Open Settings"
          >
            <svg
              class="settings-icon"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <g stroke="currentColor" stroke-width="1.5">
                <circle cx="12" cy="12" r="3" />
                <path
                  d="M13.765 2.152C13.398 2 12.932 2 12 2c-.932 0-1.398 0-1.765.152a2 2 0 0 0-1.083 1.083c-.092.223-.129.484-.143.863a1.617 1.617 0 0 1-.79 1.353 1.617 1.617 0 0 1-1.567.008c-.336-.178-.579-.276-.82-.308a2 2 0 0 0-1.478.396C4.04 5.79 3.806 6.193 3.34 7c-.466.807-.7 1.21-.751 1.605a2 2 0 0 0 .396 1.479c.148.192.355.353.676.555.473.297.777.803.777 1.361 0 .558-.304 1.064-.777 1.36-.321.203-.529.364-.676.556a2 2 0 0 0-.396 1.479c.052.394.285.798.75 1.605.467.807.7 1.21 1.015 1.453a2 2 0 0 0 1.479.396c.24-.032.483-.13.819-.308a1.617 1.617 0 0 1 1.567.008c.483.28.77.795.79 1.353.014.38.05.64.143.863a2 2 0 0 0 1.083 1.083C10.602 22 11.068 22 12 22c.932 0 1.398 0 1.765-.152a2 2 0 0 0 1.083-1.083c.092-.223.129-.483.143-.863.02-.558.307-1.074.79-1.353a1.617 1.617 0 0 1 1.567-.008c.336.178.579.276.819.308a2 2 0 0 0 1.479-.396c.315-.242.548-.646 1.014-1.453.466-.807.7-1.21.751-1.605a2 2 0 0 0-.396-1.479c-.148-.192-.355-.353-.676-.555A1.617 1.617 0 0 1 19.562 12c0-.558.304-1.064.777-1.36.321-.203.529-.364.676-.556a2 2 0 0 0 .396-1.479c-.052-.394-.285-.798-.75-1.605-.467-.807-.7-1.21-1.015-1.453a2 2 0 0 0-1.479-.396c-.24.032-.483.13-.82.308a1.617 1.617 0 0 1-1.566-.008 1.617 1.617 0 0 1-.79-1.353c-.014-.38-.05-.64-.143-.863a2 2 0 0 0-1.083-1.083Z"
                />
              </g>
            </svg>
          </button>
        </div>
      </div>

      <div id="add-reading-section">
        <button title="Add blood pressure / pulse reading" id="new-reading-btn">
          Add Today's Reading
        </button>
      </div>

      <div class="section">
        <div id="calendar-container"></div>
      </div>

      <div id="chart-section" class="section">
        <div id="chart-container" class="chart-container"></div>
      </div>

      <div class="section">
        <h2 class="history-title">History</h2>
        <div id="history-list"></div>
      </div>
    </div>

  </body>
</html>
